name: Mister Meeseeks 1.6 no-HAR test build

on:
  push:
    branches:
      - meeseeks-1.6-build
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clone original Mister Meeseeks
        shell: pwsh
        run: git clone --depth 1 https://github.com/CaptainMuscles/CM_Meeseeks_Box.git meeseeks

      - name: Apply RimWorld 1.6 API port
        shell: pwsh
        run: ./meeseeks-patches/apply-1.6.ps1

      - name: Shorten Meeseeks poof smoke
        shell: pwsh
        run: |
          $util = 'meeseeks/Source/CM_Meeseeks_Box/MeeseeksUtility.cs'
          $text = Get-Content $util -Raw
          $text = $text.Replace('GasType.BlindSmoke, 255', 'GasType.BlindSmoke, 48')
          if ($text -match 'GasType\.BlindSmoke, 255') { throw 'Maximum-density Meeseeks poof smoke remains' }
          Set-Content $util $text -Encoding UTF8

      - name: Convert HAR race to native RimWorld 1.6 race
        shell: pwsh
        run: ./meeseeks-patches/apply-native-race.ps1

      - name: Apply RimWorld 1.6 Meeseeks name rules
        shell: pwsh
        run: Copy-Item 'meeseeks-patches/RulePacks_Namers_Meeseeks_1.6.xml' 'meeseeks/Defs/RulePackDefs/RulePacks_Namers_Meeseeks.xml' -Force

      - name: Add 1.6 Meeseeks box debug controls
        shell: pwsh
        run: Copy-Item 'meeseeks-patches/CompMeeseeksBox_1.6.cs' 'meeseeks/Source/CM_Meeseeks_Box/Comps/CompMeeseeksBox.cs' -Force

      - name: Add Meeseeks helper-chain behavior
        shell: pwsh
        run: Copy-Item 'meeseeks-patches/MeeseeksChainPatches.cs' 'meeseeks/Source/CM_Meeseeks_Box/Patches/MeeseeksChainPatches.cs' -Force

      - name: Add persistent Meeseeks mission behavior
        shell: pwsh
        run: |
          Copy-Item 'meeseeks-patches/ThinkNode_MeeseeksCompleteTask_1.6.cs' 'meeseeks/Source/CM_Meeseeks_Box/Thinking/ThinkNode_MeeseeksCompleteTask.cs' -Force
          Copy-Item 'meeseeks-patches/WorkerDefUtility_1.6.cs' 'meeseeks/Source/CM_Meeseeks_Box/WorkerDefUtility.cs' -Force

      - name: Harden legacy mission fallback scanning
        shell: pwsh
        run: ./meeseeks-patches/harden-mission-scan.ps1

      - name: Route WorkType missions through vanilla Meeseeks think tree
        shell: pwsh
        run: |
          Copy-Item 'meeseeks-patches/MeeseeksVanillaWorkThinkTreePatches.cs' 'meeseeks/Source/CM_Meeseeks_Box/Patches/MeeseeksVanillaWorkThinkTreePatches.cs' -Force
          ./meeseeks-patches/apply-vanilla-work-thinktree.ps1

      - name: Make vanilla helper work scheduling diagnostic-safe
        shell: pwsh
        run: ./meeseeks-patches/fix-v22-workthinktree.ps1

      - name: Prevent random creator-murder breaks during active missions
        shell: pwsh
        run: Copy-Item 'meeseeks-patches/MeeseeksMissionMentalBreakPatches.cs' 'meeseeks/Source/CM_Meeseeks_Box/Patches/MeeseeksMissionMentalBreakPatches.cs' -Force

      - name: Validate XML and HAR removal
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem meeseeks -Recurse -Filter *.xml | ForEach-Object {
            try {
              [xml](Get-Content $_.FullName -Raw) | Out-Null
            } catch {
              $errors += "$($_.FullName): $($_.Exception.Message)"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            throw "XML validation failed"
          }

          $harHits = Select-String -Path 'meeseeks/About/About.xml','meeseeks/Defs/AlienRaces/AlienRace_Meeseeks.xml' -Pattern 'erdelf.humanoidalienraces|AlienRace.ThingDef_AlienRace|<alienRace>'
          if ($harHits) {
            $harHits | ForEach-Object { Write-Error $_ }
            throw "HAR dependency remains in active race metadata"
          }

          $nameRules = Get-Content 'meeseeks/Defs/RulePackDefs/RulePacks_Namers_Meeseeks.xml' -Raw
          if ($nameRules -notmatch 'r_name->Meeseeks' -or $nameRules -match '<li>name->Meeseeks</li>') {
            throw "Meeseeks name rule pack is not using RimWorld 1.6 r_name root"
          }

          $chainPatch = Get-Content 'meeseeks/Source/CM_Meeseeks_Box/Patches/MeeseeksChainPatches.cs' -Raw
          if ($chainPatch -notmatch 'CM_Meeseeks_Box_Job_UseMeeseeksBox' -or $chainPatch -notmatch 'PropagateTaskToDescendants') {
            throw "Meeseeks helper-chain patch was not applied"
          }

          $taskNode = Get-Content 'meeseeks/Source/CM_Meeseeks_Box/Thinking/ThinkNode_MeeseeksCompleteTask.cs' -Raw
          foreach ($marker in @('TryMakeDirectSavedJob','CompMeeseeksMissionState','MeeseeksMissionKind','FindRaidCombatJob','MurderFrustrationTicks')) {
            if ($taskNode -notmatch [regex]::Escape($marker)) {
              throw "Meeseeks mission system marker missing: $marker"
            }
          }

          $vanillaThink = Get-Content 'meeseeks/Source/CM_Meeseeks_Box/Patches/MeeseeksVanillaWorkThinkTreePatches.cs' -Raw
          foreach ($marker in @('ThinkNode_ConditionalMeeseeksWorkMission','JobGiver_MeeseeksMissionWork','base.TryIssueJobPackage','LockPawnToMissionWorkType','HasOutstandingWorkSignal','workSettingsInitialized')) {
            if ($vanillaThink -notmatch [regex]::Escape($marker)) {
              throw "v22 vanilla work marker missing: $marker"
            }
          }
          if ($vanillaThink -match 'MeeseeksWorkMissionFriendlyAttackGuard' -or $vanillaThink -match 'HarmonyPatch\(typeof\(Pawn_JobTracker\), nameof\(Pawn_JobTracker.StartJob\)\)' -or $vanillaThink -match 'JobMaker\.ReturnToPool') {
            throw "Unsafe v21 StartJob interception remains in v22"
          }
          if ($vanillaThink -match 'new\s+JobGiver_Work' -or $vanillaThink -match 'JobOnThing\(' -or $vanillaThink -match 'JobOnCell\(' -or $vanillaThink -match 'TryMakePreToilReservations\(') {
            throw "v22 WorkType patch is manufacturing or pre-reserving jobs instead of delegating to vanilla work"
          }

          $thinkTree = Get-Content 'meeseeks/Defs/ThinkTreeDefs/ThinkTrees_Meeseeks.xml' -Raw
          if ($thinkTree -notmatch 'CM_Meeseeks_Box.ThinkNode_ConditionalMeeseeksWorkMission' -or $thinkTree -notmatch 'CM_Meeseeks_Box.JobGiver_MeeseeksMissionWork') {
            throw "v22 Meeseeks vanilla work wrapper was not inserted into the think tree"
          }

          if (Test-Path 'meeseeks/Source/CM_Meeseeks_Box/Patches/MeeseeksVanillaWorkQueuePatches.cs') {
            throw "v19 direct JobGiver_Work injection was accidentally included in v22"
          }

          $mentalPatch = Get-Content 'meeseeks/Source/CM_Meeseeks_Box/Patches/MeeseeksMissionMentalBreakPatches.cs' -Raw
          if ($mentalPatch -notmatch 'CM_Meeseeks_Box_MentalBreak_MeeseeksKillCreator') {
            throw "Mission-safe mental break patch missing"
          }

          $raceXml = Get-Content 'meeseeks/Defs/AlienRaces/AlienRace_Meeseeks.xml' -Raw
          if ($raceXml -notmatch 'CompProperties_MeeseeksMissionState') {
            throw "Meeseeks mission state comp was not added to native race"
          }

          $workerUtility = Get-Content 'meeseeks/Source/CM_Meeseeks_Box/WorkerDefUtility.cs' -Raw
          if ($workerUtility -match 'Returning .* defs for') {
            throw "Legacy WorkerDefUtility debug spam remains"
          }

          $util = Get-Content 'meeseeks/Source/CM_Meeseeks_Box/MeeseeksUtility.cs' -Raw
          if ($util -match 'GasType\.BlindSmoke, 255' -or $util -notmatch 'GasType\.BlindSmoke, 48') {
            throw "Meeseeks poof smoke is not using the short-lived density"
          }

          Write-Host 'v22 validation passed: WorkType missions use a diagnostic-safe wrapper around RimWorld JobGiver_Work; v19 direct injection and v21 StartJob interception are absent.'

      - name: Restore
        shell: pwsh
        run: dotnet restore meeseeks/Source/CM_Meeseeks_Box/CM_Meeseeks_Box.csproj

      - name: Build RimWorld 1.6 DLL
        shell: pwsh
        run: dotnet build meeseeks/Source/CM_Meeseeks_Box/CM_Meeseeks_Box.csproj -c Release --no-restore -v:minimal

      - name: Package installable test mod
        shell: pwsh
        run: |
          $root = 'package/Mister Meeseeks'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($dir in @('About','Assemblies','Defs','Languages','Sounds','Textures','Patches')) {
            $src = Join-Path 'meeseeks' $dir
            if (Test-Path $src) {
              Copy-Item $src (Join-Path $root $dir) -Recurse -Force
            }
          }
          foreach ($file in @('Changelog.txt','README.md')) {
            $src = Join-Path 'meeseeks' $file
            if (Test-Path $src) {
              Copy-Item $src (Join-Path $root $file) -Force
            }
          }
          Compress-Archive -Path $root -DestinationPath 'Mister_Meeseeks_1.6_NoHAR_TestBuild.zip' -Force

      - name: Upload installable no-HAR test build
        uses: actions/upload-artifact@v4
        with:
          name: Mister_Meeseeks_1.6_NoHAR_TestBuild
          path: Mister_Meeseeks_1.6_NoHAR_TestBuild.zip