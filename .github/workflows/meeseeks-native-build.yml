name: Mister Meeseeks 1.6 no-HAR test build

on:
  push:
    branches:
      - meeseeks-1.6-build
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clone original Mister Meeseeks
        shell: pwsh
        run: git clone --depth 1 https://github.com/CaptainMuscles/CM_Meeseeks_Box.git meeseeks

      - name: Apply RimWorld 1.6 API port
        shell: pwsh
        run: ./meeseeks-patches/apply-1.6.ps1

      - name: Shorten Meeseeks poof smoke
        shell: pwsh
        run: |
          $util = 'meeseeks/Source/CM_Meeseeks_Box/MeeseeksUtility.cs'
          $text = Get-Content $util -Raw
          $text = $text.Replace('GasType.BlindSmoke, 255', 'GasType.BlindSmoke, 48')
          if ($text -match 'GasType\.BlindSmoke, 255') { throw 'Maximum-density Meeseeks poof smoke remains' }
          Set-Content $util $text -Encoding UTF8

      - name: Convert HAR race to native RimWorld 1.6 race
        shell: pwsh
        run: ./meeseeks-patches/apply-native-race.ps1

      - name: Apply RimWorld 1.6 Meeseeks name rules
        shell: pwsh
        run: Copy-Item 'meeseeks-patches/RulePacks_Namers_Meeseeks_1.6.xml' 'meeseeks/Defs/RulePackDefs/RulePacks_Namers_Meeseeks.xml' -Force

      - name: Add 1.6 Meeseeks box debug controls
        shell: pwsh
        run: Copy-Item 'meeseeks-patches/CompMeeseeksBox_1.6.cs' 'meeseeks/Source/CM_Meeseeks_Box/Comps/CompMeeseeksBox.cs' -Force

      - name: Add Meeseeks helper-chain behavior
        shell: pwsh
        run: Copy-Item 'meeseeks-patches/MeeseeksChainPatches.cs' 'meeseeks/Source/CM_Meeseeks_Box/Patches/MeeseeksChainPatches.cs' -Force

      - name: Add persistent Meeseeks mission behavior
        shell: pwsh
        run: |
          Copy-Item 'meeseeks-patches/ThinkNode_MeeseeksCompleteTask_1.6.cs' 'meeseeks/Source/CM_Meeseeks_Box/Thinking/ThinkNode_MeeseeksCompleteTask.cs' -Force
          Copy-Item 'meeseeks-patches/WorkerDefUtility_1.6.cs' 'meeseeks/Source/CM_Meeseeks_Box/WorkerDefUtility.cs' -Force

      - name: Harden mission WorkGiver scanning and retries
        shell: pwsh
        run: |
          $task = 'meeseeks/Source/CM_Meeseeks_Box/Thinking/ThinkNode_MeeseeksCompleteTask.cs'
          $text = Get-Content $task -Raw

          # Vanilla JobGiver_Work filters scanner targets through HasJobOnThing/HasJobOnCell
          # before calling JobOnThing/JobOnCell. The v16 mission scanner skipped those checks,
          # allowing jobs such as BuildRoof to be manufactured for already-roofed/reserved cells.
          $thingPattern = 'Job candidateJob = null;\s*try\s*\{\s*candidateJob = scanner\.JobOnThing\(pawn, thing, true\);\s*\}\s*catch\s*\{\s*\}'
          $thingRegex = [regex]::new($thingPattern)
          if ($thingRegex.Matches($text).Count -ne 1) {
            throw 'Could not uniquely locate mission JobOnThing scan block.'
          }
          $thingReplacement = @'
                            bool hasJobOnThing = false;
                            try
                            {
                                hasJobOnThing = !thing.IsForbidden(pawn) &&
                                                scanner.HasJobOnThing(pawn, thing, true);
                            }
                            catch
                            {
                                hasJobOnThing = false;
                            }

                            if (!hasJobOnThing)
                                continue;

                            Job candidateJob = null;
                            try
                            {
                                candidateJob = scanner.JobOnThing(pawn, thing, true);
                            }
                            catch
                            {
                            }
'@
          $text = $thingRegex.Replace($text, $thingReplacement.TrimEnd(), 1)

          $cellPattern = 'Job candidateJob = null;\s*try\s*\{\s*candidateJob = scanner\.JobOnCell\(pawn, cell, true\);\s*\}\s*catch\s*\{\s*\}'
          $cellRegex = [regex]::new($cellPattern)
          if ($cellRegex.Matches($text).Count -ne 1) {
            throw 'Could not uniquely locate mission JobOnCell scan block.'
          }
          $cellReplacement = @'
                            bool hasJobOnCell = false;
                            try
                            {
                                hasJobOnCell = !cell.IsForbidden(pawn) &&
                                               scanner.HasJobOnCell(pawn, cell, true);
                            }
                            catch
                            {
                                hasJobOnCell = false;
                            }

                            if (!hasJobOnCell)
                                continue;

                            Job candidateJob = null;
                            try
                            {
                                candidateJob = scanner.JobOnCell(pawn, cell, true);
                            }
                            catch
                            {
                            }
'@
          $text = $cellRegex.Replace($text, $cellReplacement.TrimEnd(), 1)

          # Reservation belongs to the JobDriver at job start. Doing it during mission scanning
          # can reserve a target before StartJob and make the actual driver immediately fail/retry.
          $reservePattern = 'try\s*\{\s*if \(!job\.TryMakePreToilReservations\(pawn, false\)\)\s*return null;\s*\}\s*catch\s*\{\s*return null;\s*\}\s*return job;'
          $reserveRegex = [regex]::new($reservePattern)
          if ($reserveRegex.Matches($text).Count -lt 1) {
            throw 'Could not locate PrepareJob pre-reservation block.'
          }
          $reserveReplacement = @'
            // JobDrivers own pre-toil reservations. Mission scanning only validates and chooses work.
            return job;
'@
          $text = $reserveRegex.Replace($text, $reserveReplacement.TrimEnd(), 1)

          # Add a per-pawn emergency throttle. If the same WorkGiver job fails instantly for any
          # reason, do not let the think tree recreate it ten times in the same tick.
          $fieldMarker = '        private bool snapped = false;'
          if (-not $text.Contains($fieldMarker)) {
            throw 'Could not locate Meeseeks mission-state fields.'
          }
          $fieldInsert = @'
        private bool snapped = false;
        private int lastIssuedMissionJobTick = -999999;
        private string lastIssuedMissionJobSignature = null;
'@
          $text = $text.Replace($fieldMarker, $fieldInsert.TrimEnd())

          $methodMarker = '        public void NotifyRunnableWork()'
          if (-not $text.Contains($methodMarker)) {
            throw 'Could not locate NotifyRunnableWork insertion point.'
          }
          $methodInsert = @'
        public bool ShouldThrottleRepeatedJob(Job job)
        {
            if (job == null || job.def == null)
                return false;

            int now = Find.TickManager.TicksGame;
            string signature = job.def.defName + "|" +
                               job.GetTarget(TargetIndex.A).ToString() + "|" +
                               job.GetTarget(TargetIndex.B).ToString() + "|" +
                               job.GetTarget(TargetIndex.C).ToString();

            if (signature == lastIssuedMissionJobSignature &&
                now - lastIssuedMissionJobTick < 30)
            {
                return true;
            }

            lastIssuedMissionJobSignature = signature;
            lastIssuedMissionJobTick = now;
            return false;
        }

        public void NotifyRunnableWork()
'@
          $text = $text.Replace($methodMarker, $methodInsert.TrimEnd())

          $issuePattern = 'if \(missionJob != null\)\s*\{\s*missionState\?\.NotifyRunnableWork\(\);\s*return new ThinkResult\(missionJob, this, JobTag\.MiscWork, fromQueue: false\);\s*\}'
          $issueRegex = [regex]::new($issuePattern)
          if ($issueRegex.Matches($text).Count -ne 1) {
            throw 'Could not uniquely locate mission-job issue block.'
          }
          $issueReplacement = @'
                if (missionJob != null)
                {
                    if (missionState?.ShouldThrottleRepeatedJob(missionJob) == true)
                    {
                        missionState.NotifyWaitingOnFamily();
                        Job retryWait = JobMaker.MakeJob(JobDefOf.Wait_MaintainPosture, 30);
                        return new ThinkResult(retryWait, this, JobTag.MiscWork, fromQueue: false);
                    }

                    missionState?.NotifyRunnableWork();
                    return new ThinkResult(missionJob, this, JobTag.MiscWork, fromQueue: false);
                }
'@
          $text = $issueRegex.Replace($text, $issueReplacement.TrimEnd(), 1)

          Set-Content $task $text -Encoding UTF8

      - name: Validate XML and HAR removal
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem meeseeks -Recurse -Filter *.xml | ForEach-Object {
            try {
              [xml](Get-Content $_.FullName -Raw) | Out-Null
            } catch {
              $errors += "$($_.FullName): $($_.Exception.Message)"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            throw "XML validation failed"
          }

          $harHits = Select-String -Path 'meeseeks/About/About.xml','meeseeks/Defs/AlienRaces/AlienRace_Meeseeks.xml' -Pattern 'erdelf.humanoidalienraces|AlienRace.ThingDef_AlienRace|<alienRace>'
          if ($harHits) {
            $harHits | ForEach-Object { Write-Error $_ }
            throw "HAR dependency remains in active race metadata"
          }

          $nameRules = Get-Content 'meeseeks/Defs/RulePackDefs/RulePacks_Namers_Meeseeks.xml' -Raw
          if ($nameRules -notmatch 'r_name->Meeseeks' -or $nameRules -match '<li>name->Meeseeks</li>') {
            throw "Meeseeks name rule pack is not using RimWorld 1.6 r_name root"
          }

          $chainPatch = Get-Content 'meeseeks/Source/CM_Meeseeks_Box/Patches/MeeseeksChainPatches.cs' -Raw
          if ($chainPatch -notmatch 'CM_Meeseeks_Box_Job_UseMeeseeksBox' -or $chainPatch -notmatch 'PropagateTaskToDescendants') {
            throw "Meeseeks helper-chain patch was not applied"
          }

          $taskNode = Get-Content 'meeseeks/Source/CM_Meeseeks_Box/Thinking/ThinkNode_MeeseeksCompleteTask.cs' -Raw
          foreach ($marker in @('TryMakeDirectSavedJob','CompMeeseeksMissionState','MeeseeksMissionKind','FindWorkTypeJob','FindRaidCombatJob','MurderFrustrationTicks','scanner.HasJobOnThing(pawn, thing, true)','scanner.HasJobOnCell(pawn, cell, true)','ShouldThrottleRepeatedJob')) {
            if ($taskNode -notmatch [regex]::Escape($marker)) {
              throw "Meeseeks mission system marker missing: $marker"
            }
          }
          if ($taskNode -notmatch 'JobDrivers own pre-toil reservations') {
            throw "Mission scanner still appears to own pre-toil reservations"
          }

          $raceXml = Get-Content 'meeseeks/Defs/AlienRaces/AlienRace_Meeseeks.xml' -Raw
          if ($raceXml -notmatch 'CompProperties_MeeseeksMissionState') {
            throw "Meeseeks mission state comp was not added to native race"
          }

          $workerUtility = Get-Content 'meeseeks/Source/CM_Meeseeks_Box/WorkerDefUtility.cs' -Raw
          if ($workerUtility -match 'Returning .* defs for') {
            throw "Legacy WorkerDefUtility debug spam remains"
          }

          $util = Get-Content 'meeseeks/Source/CM_Meeseeks_Box/MeeseeksUtility.cs' -Raw
          if ($util -match 'GasType\.BlindSmoke, 255' -or $util -notmatch 'GasType\.BlindSmoke, 48') {
            throw "Meeseeks poof smoke is not using the short-lived density"
          }

          Write-Host 'XML/HAR checks passed; persistent mission scanning uses vanilla HasJob filters, JobDriver reservations, retry throttling, and short-lived Meeseeks poof smoke.'

      - name: Restore
        shell: pwsh
        run: dotnet restore meeseeks/Source/CM_Meeseeks_Box/CM_Meeseeks_Box.csproj

      - name: Build RimWorld 1.6 DLL
        shell: pwsh
        run: dotnet build meeseeks/Source/CM_Meeseeks_Box/CM_Meeseeks_Box.csproj -c Release --no-restore -v:minimal

      - name: Package installable test mod
        shell: pwsh
        run: |
          $root = 'package/Mister Meeseeks'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($dir in @('About','Assemblies','Defs','Languages','Sounds','Textures','Patches')) {
            $src = Join-Path 'meeseeks' $dir
            if (Test-Path $src) {
              Copy-Item $src (Join-Path $root $dir) -Recurse -Force
            }
          }
          foreach ($file in @('Changelog.txt','README.md')) {
            $src = Join-Path 'meeseeks' $file
            if (Test-Path $src) {
              Copy-Item $src (Join-Path $root $file) -Force
            }
          }
          Compress-Archive -Path $root -DestinationPath 'Mister_Meeseeks_1.6_NoHAR_TestBuild.zip' -Force

      - name: Upload installable no-HAR test build
        uses: actions/upload-artifact@v4
        with:
          name: Mister_Meeseeks_1.6_NoHAR_TestBuild
          path: Mister_Meeseeks_1.6_NoHAR_TestBuild.zip
